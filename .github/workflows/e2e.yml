# Tests de extremo a extremo (Playwright) contra un Supabase local en Docker.
# Qué hacen y cómo reproducirlos: docs/operaciones/e2e.md
#
# Solo corren de noche y a mano (Actions → E2E → Run workflow), no en cada
# subida ni en cada pull request: cada ejecución tarda varios minutos y gasta
# minutos de Actions. Las acciones van fijadas por SHA, como en ci.yml.

name: E2E

on:
  schedule:
    # 23:07 UTC: las 00:07 en horario de invierno (01:07 en verano). Cron de
    # GitHub no admite zona horaria, y se evita la hora en punto, que es cuando
    # más ejecuciones se retrasan.
    - cron: '7 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Base de datos, API, Storage y login, en contenedores. Aplica las
      # migraciones y los dos seeds de supabase/config.toml.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - run: supabase start

      # URL y claves del Supabase local, más los valores de prueba del resto de
      # variables, a $GITHUB_ENV: los ven el build y el servidor.
      - run: node scripts/e2e-env.mjs >> "$GITHUB_ENV"

      # Build propio: las NEXT_PUBLIC_* se incrustan al compilar.
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - name: Estado de los contenedores (solo si falla)
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7