# Configuración de la CLI de Supabase para el desarrollo local y los E2E del CI
# (docs/operaciones/e2e.md). NO afecta al proyecto de producción: `supabase db
# push` solo aplica las migraciones. Generada con `supabase init` (CLI 3.0.0) y
# recortada a lo que usa la web: base de datos, API REST, Storage y login. El
# resto de servicios va apagado para que `supabase start` tarde menos y pida
# menos memoria.

project_id = "greener-web"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# La versión de producción (Settings → Infrastructure: Postgres 17.6.1.155).
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = true
# `seed.sql`: dominio admin. `seed_demo_data.sql`: 50 casos y 9 episodios de
# demostración, generados con `node scripts/generate-demo-data.mjs`.
sql_paths = ["./seed.sql", "./seed_demo_data.sql"]

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
enable_signup = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
